<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liên hệ</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #e6f4ea; margin: 0; padding: 20px; }
    .box { max-width: 700px; margin: auto; background: #fff; padding: 25px; border-radius: 10px; }
    h1 { color: #274e13; text-align: center; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input[type=text], input[type=email], textarea { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 15px; padding: 10px 20px; background: #38761d; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    iframe { width: 100%; height: 300px; border: 0; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Liên hệ với mình</h1>

    <form action="mailto:nguyenvana@email.com" method="post" enctype="text/plain">
      <label for="hoten">Họ tên:</label>
      <input type="text" id="hoten" name="hoten" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="noidung">Nội dung:</label>
      <textarea id="noidung" name="noidung" rows="5" required></textarea>

      <button type="submit">Gửi</button>
      <button type="reset">Nhập lại</button>
    </form>

    <h2>Bản đồ</h2>
    <iframe src="https://www.google.com/maps?q=Ho+Chi+Minh+City&output=embed" allowfullscreen loading="lazy"></iframe>
  </div>
</body>
</html>
